# Проверяет, что скрипты запуска работают на чистых машинах: Windows, Mac на
# Apple Silicon и Mac на Intel. Ничего заранее не ставим — как у ученика.
# Раз в неделю прогоняется сама: ловит, если поменялись ссылки на релизы.
name: Проверка скриптов

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '0 3 * * 1'

jobs:
  windows:
    name: Windows${{ matrix.label }}
    runs-on: windows-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: ''
            dir: ''
          - label: ' · кириллица и пробел в пути'
            dir: 'C:\Users\runneradmin\Айгерим Тест\aql juice'
    env:
      AQL_JUICE_DIR: ${{ matrix.dir }}
    steps:
      - uses: actions/checkout@v5

      # Всё в одном шаге: на Windows фоновый процесс может не пережить границу шагов.
      - name: Запуск, задания, повторный запуск
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          function Dump([string]$file) { if (Test-Path $file) { (Get-Content $file -Encoding utf8) -join '%0A' } else { "($file нет)" } }
          function Fail([string]$why, [string]$file) {
            $text = Dump $file
            if ($text.Length -gt 3500) { $text = $text.Substring($text.Length - 3500) }
            Write-Output "::error title=Windows${{ matrix.label }}: $why::$text"
            exit 1
          }

          $p = Start-Process cmd.exe -ArgumentList '/c', 'start-windows.bat < NUL' -NoNewWindow -PassThru `
            -RedirectStandardOutput out.txt -RedirectStandardError err.txt
          $ok = $false
          for ($i = 0; $i -lt 900; $i++) {
            try { Invoke-WebRequest -UseBasicParsing -TimeoutSec 2 http://localhost:3000/rest/admin/application-version | Out-Null; $ok = $true; break } catch {}
            if ($p.HasExited) { break }
            Start-Sleep -Seconds 1
          }
          Get-Content out.txt -Encoding utf8
          if (-not $ok) { Get-Content err.txt -Encoding utf8 -ErrorAction SilentlyContinue | Add-Content out.txt; Fail 'Juice Shop не поднялся' out.txt }
          Write-Output "::notice title=Windows${{ matrix.label }}::Juice Shop поднялся за $i с"

          try { Invoke-WebRequest -UseBasicParsing http://localhost:3000/rest/qwertz | Out-Null } catch {}
          Set-Content -Path t.xml -Value '<?xml version="1.0"?><complaint><text>hi</text></complaint>'
          & curl.exe -s -o upload.txt -F "file=@t.xml;type=text/xml" http://localhost:3000/file-upload
          Start-Sleep -Seconds 2
          try { $solved = (Invoke-RestMethod http://localhost:3000/api/Challenges).data | Where-Object solved | ForEach-Object name }
          catch { $_ | Out-String | Set-Content err2.txt; Fail 'API заданий не ответил' err2.txt }
          Write-Output "Решено: $($solved -join ', ')"
          if ($solved -notcontains 'Error Handling') { Fail 'Не засчиталось Error Handling' out.txt }
          if ($solved -notcontains 'Deprecated Interface') { Fail 'XML не разобрался (libxmljs2)' upload.txt }
          Write-Output "::notice title=Windows${{ matrix.label }}::Засчитано: $($solved -join ', ')"

          $again = Start-Process cmd.exe -ArgumentList '/c', 'start-windows.bat < NUL' -NoNewWindow -PassThru -Wait `
            -RedirectStandardOutput again.txt -RedirectStandardError again-err.txt
          Get-Content again.txt -Encoding utf8
          if (-not (Select-String -Path again.txt -Pattern 'уже запущен' -Encoding utf8 -Quiet)) { Fail 'Повторный запуск не узнал работающий Juice Shop' again.txt }
          Write-Output "::notice title=Windows${{ matrix.label }}::Повторный запуск открыл браузер, код $($again.ExitCode)"
          exit 0

  mac:
    name: Mac · ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            label: Apple Silicon
          - os: macos-15-intel
            label: Intel
    steps:
      - uses: actions/checkout@v5

      - name: Первый запуск start-mac.command
        run: |
          mkdir -p fakebin && printf '#!/bin/sh\necho "[open] $*"\n' > fakebin/open && chmod +x fakebin/open
          uname -m
          PATH="$PWD/fakebin:/usr/bin:/bin:/usr/sbin:/sbin" nohup bash start-mac.command </dev/null > out.txt 2>&1 &
          for i in $(seq 1 600); do
            curl -fs http://localhost:3000/rest/admin/application-version >/dev/null && break
            sleep 1
          done
          cat out.txt
          curl -fs http://localhost:3000/rest/admin/application-version || { echo "::error::Juice Shop не поднялся"; exit 1; }
          echo "::notice title=Mac ${{ matrix.label }}::Juice Shop поднялся за $i с"

      - name: Juice Shop засчитывает задания
        run: |
          curl -s -o /dev/null http://localhost:3000/rest/qwertz
          printf '<?xml version="1.0"?><complaint><text>hi</text></complaint>' > t.xml
          curl -s -o /dev/null -F "file=@t.xml;type=text/xml" http://localhost:3000/file-upload
          sleep 2
          solved="$(curl -s http://localhost:3000/api/Challenges | python3 -c 'import json,sys; print(", ".join(c["name"] for c in json.load(sys.stdin)["data"] if c["solved"]))')"
          echo "Решено: $solved"
          [[ "$solved" == *"Error Handling"* ]] || { echo "::error::Не засчиталось Error Handling"; exit 1; }
          [[ "$solved" == *"Deprecated Interface"* ]] || { echo "::error::XML не разобрался (libxmljs2)"; exit 1; }
          echo "::notice title=Mac ${{ matrix.label }}::Засчитано: $solved"

      - name: Повторный запуск видит работающий Juice Shop
        run: |
          PATH="$PWD/fakebin:/usr/bin:/bin:/usr/sbin:/sbin" bash start-mac.command </dev/null > again.txt 2>&1
          cat again.txt
          grep -q "уже запущен" again.txt
